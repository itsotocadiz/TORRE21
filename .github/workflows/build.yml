name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilacion y Generacion de APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar fuentes y plugins de Capacitor
        run: |
          node scripts/sync-all.js
          npx cap sync android

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Android SDK y aceptar licencias
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Dar permisos de ejecucion a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copiar APK generado a la raiz
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BlackjackTorre21.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackTorre21-APK
          path: BlackjackTorre21.apk
          retention-days: 14

      - name: Publicar Release (Lanzamiento)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Black Jack Torre 21 — v1.7.4 (Build #${{ github.run_number }})
          body: |
            ### ♠ Black Jack: La Torre del 21 — v1.7.4 (BUILD 38)
            Compilación continua generada automáticamente en GitHub Actions para Android.
            
            * Toca `BlackjackTorre21.apk` para instalar o actualizar el juego en tu dispositivo móvil.
            * Novedades v1.7.4:
              - Daño matemático táctico puro sin escalado por nivel (`levelMult`).
              - Crítico dinámico RPG evaluado en cualquier mano ganadora.
              - Parry Celestial al empatar con 21 en primera mano.
              - Dado del Destino del Campeón (D100) tras abatir jefes de acto.
              - Cartas coleccionables de monstruo estilo Ragnarok con corona dorada `👑`.
              - Altar Sacrificial con opción de renuncia (-15% metamonedas).
              - Corrección del límite de 2 compras en la tienda y bloqueo táctil.
              - Mazos y sellos aislados por héroe en el Mercado de Metamonedas de la tienda.
              - Códice de la Torre ampliado a 6 secciones y lore conciso de 2 líneas.
          files: BlackjackTorre21.apk
