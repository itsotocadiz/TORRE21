name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilacion y Generacion de APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar fuentes y plugins de Capacitor
        run: |
          node scripts/sync-all.js
          npx cap sync android

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Android SDK y aceptar licencias
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Dar permisos de ejecucion a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copiar APK generado a la raiz
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BlackjackTorre21.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackTorre21-APK
          path: BlackjackTorre21.apk
          retention-days: 14

      - name: Publicar Release (Lanzamiento)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Black Jack Torre 21 — v2.0.0 (Build #${{ github.run_number }})
          body: |
            ### ♠ Black Jack: La Torre del 21 — v2.0.0 (BUILD 57)
            Compilación continua generada automáticamente en GitHub Actions para Android.
            
            * Toca `BlackjackTorre21.apk` para instalar o actualizar el juego en tu dispositivo móvil.
            * Novedades v2.0.0:
              - **BLOQUE 1**: Las cartas visibles del rival ahora se expanden en 3D (240x340px) al tocarlas, mostrando su nombre, valor y habilidades oscuras (`darkSigil` / `specialEffect`) con giro `rotateY(180deg)`.
              - **BLOQUE 2**: El botón `▶ REANUDAR PARTIDA` ahora siempre aparece al volver al Campamento desde una partida activa, manteniendo el estado guardado en `localStorage`.
              - **BLOQUE 3**: Candado estricto en la tienda: máximo 1 poción por tipo y máximo 2 objetos de oro por piso (el contador persiste entre aperturas de la tienda y se reinicia solo al cambiar de piso).
              - **BLOQUE 4**: Separación de mecánicas: el Árbol de Talentos (28 nodos) es PERMANENTE y se otiene al subir de nivel; la Mejora de Ascenso (Buff/Nerf) es exclusiva de la run y se elige al pasar de Acto.
            * APK `BlackjackTorre21.apk` y `TORRE21-v2.0.0.apk` listos para descargar.
          files: BlackjackTorre21.apk
