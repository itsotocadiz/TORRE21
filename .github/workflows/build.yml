name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilacion y Generacion de APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar fuentes y plugins de Capacitor
        run: |
          node scripts/sync-all.js
          npx cap sync android

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Android SDK y aceptar licencias
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Dar permisos de ejecucion a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copiar APK generado a la raiz
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BlackjackTorre21.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackTorre21-APK
          path: BlackjackTorre21.apk
          retention-days: 14

      - name: Publicar Release (Lanzamiento)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Black Jack Torre 21 — v1.8.1 (Build #${{ github.run_number }})
          body: |
            ### ♠ Black Jack: La Torre del 21 — v1.8.1 (BUILD 42)
            Compilación continua generada automáticamente en GitHub Actions para Android.
            
            * Toca `BlackjackTorre21.apk` para instalar o actualizar el juego en tu dispositivo móvil.
            * Novedades v1.8.1:
              - Blindaje contra crash/salida en el primer combate (inicialización defensiva `ensureBattleStateInitialized`).
              - Corrección del selector de bendiciones del destino (`STARTER_BLESSINGS`) y guardado persistente en el Códice.
              - Códice 100% coleccionable con 5 pestañas: Memorias, Cartas Cosméticas, Bendiciones, Reliquias y Bestiario con siluetas `?`.
              - Unificación de metamonedas a Calavera de Cripta `💀` en tienda, compras y transmutación de cartas/sellos.
              - Ficha de combate traducida al español con iconos, eliminación de bonos inexistentes y desglose dinámico de atributos RPG.
          files: BlackjackTorre21.apk
