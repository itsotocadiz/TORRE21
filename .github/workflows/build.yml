name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilacion y Generacion de APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar fuentes y plugins de Capacitor
        run: |
          node scripts/sync-all.js
          npx cap sync android

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Android SDK y aceptar licencias
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Dar permisos de ejecucion a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copiar APK generado a la raiz
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BlackjackTorre21.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackTorre21-APK
          path: BlackjackTorre21.apk
          retention-days: 14

      - name: Publicar Release (Lanzamiento)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Black Jack Torre 21 — v2.0.1 (Build #${{ github.run_number }})
          body: |
            ### ♠ Black Jack: La Torre del 21 — v2.0.1 (BUILD 58)
            Compilación continua generada automáticamente en GitHub Actions para Android.
            
            * Toca `BlackjackTorre21.apk` para instalar o actualizar el juego en tu dispositivo móvil.
            * Novedades v2.0.1:
              - **BLOQUE 1**: Árbol de Talentos (28 nodos) completamente interconectado a las estadísticas permanentes base del héroe (`p.permanentBase`) y afinidades elementales en combate.
              - **BLOQUE 2**: Catálogo de accesorios al 100% (Cinturón de Espinas, Amuleto Sangriento, Ojo del Vidente, Pata de Conejo, Guante de Plomo y Banda de Mercurio) con efecto en batalla y reflejo matemático en Ficha de Héroe (BUFF/NERF).
              - **BLOQUE 3**: Modal 3D detallado de naipes en combate tanto para rival como para jugador (cartas estándar con valor Blackjack, afinidad de palo y sinergia de pareja; cartas especiales con sello y arte cósmico; botón táctil de cierre).
              - **BLOQUE 4**: Pactos del Abismo persistidos en `player.activePacts` con aplicación inmediata de bonos y penalizaciones en atributos.
              - **BLOQUE 5**: Rueda del Destino interconectada a Suerte (`player.luck`) con persistencia de estadísticas de run y recálculo en tiempo real.
              - **BLOQUE 6**: Curva de dificultad y progresión equilibrada en Actos 1 y 2 (Dante de Picas 85 HP/11 PWR, Valquiria 115 HP/14 PWR, pools de enemigos ajustados y curación de descanso).
            * APK `BlackjackTorre21.apk` y `TORRE21-v2.0.1.apk` listos para descargar.
          files: BlackjackTorre21.apk
