<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <radialGradient id="ironWash" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2d1c16"/>
      <stop offset="60%" stop-color="#19110e"/>
      <stop offset="100%" stop-color="#0a0705"/>
    </radialGradient>
    <radialGradient id="fireL" cx="20%" cy="35%" r="30%">
      <stop offset="0%" stop-color="#ff9e00" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#e85d04" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#19110e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireR" cx="80%" cy="35%" r="30%">
      <stop offset="0%" stop-color="#ff9e00" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#e85d04" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#19110e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#ironWash)"/>

  <!-- Almenas y pilares de sillar de fortaleza -->
  <rect x="0" y="0" width="80" height="340" fill="#1e1815"/>
  <rect x="280" y="0" width="80" height="340" fill="#1e1815"/>
  <line x1="80" y1="0" x2="80" y2="340" stroke="#3d302a" stroke-width="3"/>
  <line x1="280" y1="0" x2="280" y2="340" stroke="#3d302a" stroke-width="3"/>

  <!-- Estandartes de hierro bélicos -->
  <polygon points="25,40 55,40 55,160 40,140 25,160" fill="#9d0208"/>
  <polygon points="305,40 335,40 335,160 320,140 305,160" fill="#9d0208"/>

  <!-- Antorchas de hierro de pared encendidas -->
  <circle cx="50" cy="220" r="55" fill="url(#fireL)"/>
  <polygon points="40,230 60,230 50,205" fill="#f48c06"/>
  <polygon points="44,228 56,228 50,212" fill="#ffba08"/>
  <rect x="48" y="230" width="4" height="35" fill="#141414"/>

  <circle cx="310" cy="220" r="55" fill="url(#fireR)"/>
  <polygon points="300,230 320,230 310,205" fill="#f48c06"/>
  <polygon points="304,228 316,228 310,212" fill="#ffba08"/>
  <rect x="308" y="230" width="4" height="35" fill="#141414"/>

  <!-- Suelo de baldosas de hierro y piedra -->
  <ellipse cx="180" cy="540" rx="190" ry="110" fill="#191310"/>
  <ellipse cx="180" cy="520" rx="140" ry="40" fill="#dc2f02" opacity="0.15"/>
</svg>