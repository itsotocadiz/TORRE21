<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <radialGradient id="mudAmb" cx="50%" cy="80%" r="75%">
      <stop offset="0%" stop-color="#2a3824"/>
      <stop offset="50%" stop-color="#141a12"/>
      <stop offset="100%" stop-color="#070a07"/>
    </radialGradient>
    <radialGradient id="slimyGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#588157" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#141a12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#mudAmb)"/>
  <circle cx="180" cy="200" r="140" fill="url(#slimyGlow)"/>

  <!-- Muros de piedra húmeda con musgo -->
  <path d="M0 0 L120 0 L90 280 L0 320 Z" fill="#0f140e" opacity="0.9"/>
  <path d="M360 0 L240 0 L270 280 L360 320 Z" fill="#0f140e" opacity="0.9"/>
  <!-- Líneas de sillar y grietas de calabozo -->
  <line x1="0" y1="80" x2="105" y2="80" stroke="#1b2419" stroke-width="2"/>
  <line x1="0" y1="160" x2="98" y2="160" stroke="#1b2419" stroke-width="2"/>
  <line x1="0" y1="240" x2="92" y2="240" stroke="#1b2419" stroke-width="2"/>
  <line x1="255" y1="80" x2="360" y2="80" stroke="#1b2419" stroke-width="2"/>
  <line x1="262" y1="160" x2="360" y2="160" stroke="#1b2419" stroke-width="2"/>
  <line x1="268" y1="240" x2="360" y2="240" stroke="#1b2419" stroke-width="2"/>

  <!-- Reja de calabozo en el fondo -->
  <rect x="110" y="70" width="140" height="180" rx="8" fill="#090d08"/>
  <line x1="135" y1="70" x2="135" y2="250" stroke="#222b1f" stroke-width="4"/>
  <line x1="160" y1="70" x2="160" y2="250" stroke="#222b1f" stroke-width="4"/>
  <line x1="180" y1="70" x2="180" y2="250" stroke="#222b1f" stroke-width="4"/>
  <line x1="200" y1="70" x2="200" y2="250" stroke="#222b1f" stroke-width="4"/>
  <line x1="225" y1="70" x2="225" y2="250" stroke="#222b1f" stroke-width="4"/>

  <!-- Cadenas colgantes oxidadas -->
  <path d="M60 0 L60 140" stroke="#3a4734" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="60" cy="145" r="6" fill="none" stroke="#3a4734" stroke-width="3"/>
  <path d="M300 0 L300 110" stroke="#3a4734" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="300" cy="115" r="6" fill="none" stroke="#3a4734" stroke-width="3"/>

  <!-- Suelo de fango y charcos turbios -->
  <ellipse cx="180" cy="540" rx="190" ry="110" fill="#131911"/>
  <ellipse cx="140" cy="510" rx="80" ry="25" fill="#3a5a40" opacity="0.35"/>
  <ellipse cx="230" cy="560" rx="60" ry="20" fill="#3a5a40" opacity="0.3"/>
</svg>