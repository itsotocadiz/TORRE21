<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <radialGradient id="astralDeep" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#02070f"/>
    </radialGradient>
    <radialGradient id="auroraWash" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#02070f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starlightFloor" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#02070f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#astralDeep)"/>
  <circle cx="180" cy="230" r="160" fill="url(#auroraWash)"/>
  <circle cx="180" cy="540" r="160" fill="url(#starlightFloor)"/>

  <!-- Constelaciones místicas del 21 -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.75" fill="#e0f2fe">
    <circle cx="60" cy="90" r="2.5"/>
    <circle cx="110" cy="70" r="2"/>
    <circle cx="160" cy="85" r="3"/>
    <circle cx="210" cy="65" r="2.5"/>
    <circle cx="270" cy="80" r="3"/>
    <circle cx="310" cy="110" r="2"/>
    <line x1="60" y1="90" x2="110" y2="70"/>
    <line x1="110" y1="70" x2="160" y2="85"/>
    <line x1="160" y1="85" x2="210" y2="65"/>
    <line x1="210" y1="65" x2="270" y2="80"/>
    <line x1="270" y1="80" x2="310" y2="110"/>
  </g>

  <!-- Glifo circular del Naipe Sagrado -->
  <circle cx="180" cy="210" r="70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="180" cy="210" r="50" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.7"/>
  <!-- Glifo numérico 21 en el centro astral -->
  <text x="180" y="218" text-anchor="middle" font-family="'Fredoka', sans-serif" font-size="24" font-weight="900" fill="#facc15" opacity="0.85">21</text>

  <!-- Orbes y cartas arcanas flotando en órbita -->
  <circle cx="110" cy="210" r="5" fill="#facc15" opacity="0.9"/>
  <circle cx="250" cy="210" r="5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="180" cy="140" r="4" fill="#a855f7" opacity="0.8"/>
  <circle cx="180" cy="280" r="4" fill="#f43f5e" opacity="0.8"/>

  <!-- Almenas astrales flotantes -->
  <path d="M0 0 L80 0 L50 240 L0 280 Z" fill="#061220" opacity="0.95"/>
  <path d="M360 0 L280 0 L310 240 L360 280 Z" fill="#061220" opacity="0.95"/>
  <line x1="0" y1="100" x2="68" y2="100" stroke="#0e2945" stroke-width="2"/>
  <line x1="292" y1="100" x2="360" y2="100" stroke="#0e2945" stroke-width="2"/>

  <!-- Plataforma de estrellas de cristal -->
  <ellipse cx="180" cy="540" rx="160" ry="60" fill="#091b30" stroke="#0284c7" stroke-width="3"/>
  <ellipse cx="180" cy="540" rx="130" ry="45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="16 8" opacity="0.7"/>
  <ellipse cx="180" cy="540" rx="90" ry="30" fill="none" stroke="#facc15" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.5"/>
</svg>
