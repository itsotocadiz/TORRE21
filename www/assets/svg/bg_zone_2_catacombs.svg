<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <radialGradient id="cataWash" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1329"/>
      <stop offset="60%" stop-color="#100b17"/>
      <stop offset="100%" stop-color="#060408"/>
    </radialGradient>
    <radialGradient id="purpleGlowL" cx="20%" cy="45%" r="28%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#5a189a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#100b17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlowR" cx="80%" cy="45%" r="28%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#5a189a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#100b17" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#cataWash)"/>

  <!-- Arcos góticos y criptas en nichos -->
  <path d="M0 0 L100 0 L100 180 Q60 140 0 160 Z" fill="#0d0813"/>
  <path d="M360 0 L260 0 L260 180 Q300 140 360 160 Z" fill="#0d0813"/>

  <!-- Nichos con cráneos en las paredes -->
  <rect x="25" y="190" width="50" height="70" rx="25" fill="#08050c"/>
  <circle cx="50" cy="225" r="12" fill="#d8c5b2" opacity="0.65"/>
  <circle cx="46" cy="223" r="3" fill="#08050c"/>
  <circle cx="54" cy="223" r="3" fill="#08050c"/>

  <rect x="285" y="190" width="50" height="70" rx="25" fill="#08050c"/>
  <circle cx="310" cy="225" r="12" fill="#d8c5b2" opacity="0.65"/>
  <circle cx="306" cy="223" r="3" fill="#08050c"/>
  <circle cx="314" cy="223" r="3" fill="#08050c"/>

  <!-- Cirios espectrales morados -->
  <circle cx="50" cy="285" r="45" fill="url(#purpleGlowL)"/>
  <rect x="47" y="290" width="6" height="20" fill="#f3c68f"/>
  <polygon points="46,290 54,290 50,276" fill="#c77dff"/>
  <polygon points="48,288 52,288 50,280" fill="#e0aaff"/>

  <circle cx="310" cy="285" r="45" fill="url(#purpleGlowR)"/>
  <rect x="307" y="290" width="6" height="20" fill="#f3c68f"/>
  <polygon points="306,290 314,290 310,276" fill="#c77dff"/>
  <polygon points="308,288 312,288 310,280" fill="#e0aaff"/>

  <!-- Lápidas funerarias en el horizonte de piedra negra -->
  <polygon points="180,90 120,240 240,240" fill="#130d1c" opacity="0.8"/>
  <ellipse cx="180" cy="530" rx="180" ry="110" fill="#0e0914"/>
  <!-- Niebla fúnebre morada baja -->
  <ellipse cx="180" cy="510" rx="150" ry="35" fill="#5a189a" opacity="0.2"/>
</svg>