<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <radialGradient id="goldWash" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3a2512"/>
      <stop offset="60%" stop-color="#1f1308"/>
      <stop offset="100%" stop-color="#0a0602"/>
    </radialGradient>
    <radialGradient id="chandelierGlow" cx="50%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#e76f51" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0602" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#goldWash)"/>
  <circle cx="180" cy="110" r="140" fill="url(#chandelierGlow)"/>

  <!-- Cortinajes de terciopelo carmesí noble -->
  <path d="M0 0 L110 0 Q70 120 100 240 L0 270 Z" fill="#590d22"/>
  <path d="M360 0 L250 0 Q290 120 260 240 L360 270 Z" fill="#590d22"/>

  <!-- Columnas clásicas de mármol con remates dorados -->
  <rect x="40" y="40" width="30" height="300" fill="#d8d5db"/>
  <rect x="35" y="35" width="40" height="12" fill="#ffd166"/>
  <rect x="35" y="328" width="40" height="12" fill="#ffd166"/>

  <rect x="290" y="40" width="30" height="300" fill="#d8d5db"/>
  <rect x="285" y="35" width="40" height="12" fill="#ffd166"/>
  <rect x="285" y="328" width="40" height="12" fill="#ffd166"/>

  <!-- Candelabro dorado colgante central -->
  <line x1="180" y1="0" x2="180" y2="70" stroke="#ffd166" stroke-width="2"/>
  <ellipse cx="180" cy="75" rx="40" ry="10" fill="none" stroke="#ffd166" stroke-width="3"/>
  <circle cx="145" cy="72" r="3" fill="#fffae0"/>
  <circle cx="165" cy="74" r="3" fill="#fffae0"/>
  <circle cx="195" cy="74" r="3" fill="#fffae0"/>
  <circle cx="215" cy="72" r="3" fill="#fffae0"/>

  <!-- Suelo de mármol y alfombra real dorada -->
  <ellipse cx="180" cy="540" rx="190" ry="110" fill="#1b1108"/>
  <polygon points="110,640 140,460 220,460 250,640" fill="#800f2f"/>
  <line x1="140" y1="460" x2="110" y2="640" stroke="#ffd166" stroke-width="2"/>
  <line x1="220" y1="460" x2="250" y2="640" stroke="#ffd166" stroke-width="2"/>
</svg>